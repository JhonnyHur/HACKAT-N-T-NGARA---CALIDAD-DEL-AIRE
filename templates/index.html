<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estación · Calidad del Aire</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>Estación de Calidad del Aire</h1>
        <p>Monitoreo PM2.5 · Temperatura · Humedad</p>
      </div>
    </div>

    <div class="split-toggle" role="tablist" aria-label="Conjunto de datos">
      <button class="split-btn active" data-split="train" role="tab" aria-selected="true">Train</button>
      <button class="split-btn" data-split="test" role="tab" aria-selected="false">Test</button>
      <span class="split-thumb" aria-hidden="true"></span>
    </div>
  </header>

  <main class="layout">

    <section class="panel map-panel">
      <div class="panel-head">
        <h2>Ubicación de sensores</h2>
        <span class="panel-sub" id="sensorCount">—</span>
      </div>
      <div id="map"></div>
      <div class="legend">
        <span class="legend-label">PM2.5 (μg/m³)</span>
        <div class="legend-bar">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="legend-ticks">
          <em>0</em><em>25</em><em>50</em><em>75</em><em>100+</em>
        </div>
      </div>
    </section>

    <section class="panel sensor-panel">
      <div class="panel-head">
        <h2>Sensor activo</h2>
        <div class="sensor-tabs" id="sensorTabs"></div>
      </div>

      <div class="stat-row" id="statRow">
        <div class="stat">
          <span class="stat-label">PM2.5 actual</span>
          <span class="stat-value" id="statPm25">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Temperatura</span>
          <span class="stat-value" id="statTemp">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Humedad</span>
          <span class="stat-value" id="statHum">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Lecturas</span>
          <span class="stat-value" id="statCount">—</span>
        </div>
      </div>

      <div class="chart-block">
        <h3>PM2.5 en el tiempo <span class="chart-hint" id="pm25Hint"></span></h3>
        <div class="chart-canvas-wrap"><canvas id="chartPm25"></canvas></div>
      </div>

      <div class="chart-grid">
        <div class="chart-block">
          <h3>Temperatura (°C)</h3>
          <div class="chart-canvas-wrap"><canvas id="chartTemp"></canvas></div>
        </div>
        <div class="chart-block">
          <h3>Humedad (%)</h3>
          <div class="chart-canvas-wrap"><canvas id="chartHum"></canvas></div>
        </div>
      </div>

      <div class="chart-block">
        <h3>PM2.5 vs Humedad</h3>
        <div class="chart-canvas-wrap"><canvas id="chartScatter"></canvas></div>
      </div>
    </section>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_version }}"></script>
</body>
</html>
